<title>KnuPdf</title>
<link rel="icon" type="image/svg+xml" href="knupdf.svg">
<style>
  /* One-screen app: the canvas fills the frame; a centred status card shows while the engine loads. */
  :root { --bg: #f1f1f3; --fg: #23232a; --muted: #6b6b78; --accent: #12a58a; --track: #dcdce2; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #19191c; --fg: #e8e8ee; --muted: #9a9aa8; --accent: #2fc4a6; --track: #34343b; --card: #222227; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #19191c; --fg: #e8e8ee; --muted: #9a9aa8; --accent: #2fc4a6; --track: #34343b; --card: #222227; color-scheme: dark }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #boot[hidden] { display: none; }
  #boot .card { background: var(--card); border-radius: 10px; padding: 24px 28px; width: min(360px, 100%); display: grid; gap: 12px; box-shadow: 0 6px 24px rgb(0 0 0 / .08); }
  #boot .head { display: flex; align-items: center; gap: 12px; }
  #boot .head svg { width: 40px; height: 40px; flex: none; }
  #boot h1 { margin: 0; font-size: 18px; font-weight: 650; }
  #boot p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  #boot .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #boot .num { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { #boot .bar i { transition: none; } }
</style>

<canvas id="pdfcraft"></canvas>
<div id="boot" role="status">
  <div class="card">
    <div class="head">
      <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M66 12 H190 L244 66 V190 Q244 244 190 244 H66 Q12 244 12 190 V66 Q12 12 66 12 Z" fill="#0A4A9F"/><path d="M190 12 L244 66 H206 Q190 66 190 50 Z" fill="#A9C6EE"/><path d="M66.0 59.3 L101.0 59.3 L101.0 107.9 L144.2 59.3 L187.3 59.3 L133.4 116.0 L190.0 180.7 L146.9 180.7 L101.0 126.7 L101.0 180.7 L66.0 180.7 Z" fill="#FFFFFF"/><rect x="70" y="204" width="116" height="10" rx="5" fill="#A9C6EE"/></svg>
      <h1>KnuPdf 불러오는 중</h1>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p id="msg">PDF 엔진(약 14MB)을 내려받고 있습니다. <span class="num" id="pct">0%</span></p>
  </div>
</div>

<script type="module">
  const parts = ['./part0.wasm', './part1.wasm'];
  const bar = document.getElementById('bar'), pct = document.getElementById('pct'), msg = document.getElementById('msg');
  const TOTAL = 14849562;
  let loaded = 0;
  const progress = (n) => { loaded += n; const p = Math.min(100, Math.round(loaded / TOTAL * 100)); bar.style.width = p + '%'; pct.textContent = p + '%'; };

  async function fetchPart(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(url + ' 응답 ' + res.status);
    const reader = res.body.getReader(), chunks = [];
    for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); progress(value.length); }
    return new Blob(chunks);
  }

  try {
    const blobs = await Promise.all(parts.map(fetchPart));
    msg.textContent = '엔진을 준비하고 있습니다…';
    const stream = new Blob(blobs).stream().pipeThrough(new DecompressionStream('gzip'));
    const wasm = await new Response(stream).arrayBuffer();
    const { default: init } = await import('./pdfcraft.js');
    await init({ module_or_path: wasm });
    document.getElementById('boot').hidden = true;
  } catch (e) {
    msg.textContent = '불러오지 못했습니다: ' + (e && e.message ? e.message : e) + ' — 최신 Chrome·Edge·Firefox·Safari에서 새로고침해 주세요.';
    console.error(e);
  }
</script>
